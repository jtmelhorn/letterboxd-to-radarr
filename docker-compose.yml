services:
  letterboxd-to-radarr:
    image: ghcr.io/jtmelhorn/letterboxd-to-radarr:latest
    # Uncomment to build from this repo instead of pulling the published image.
    # build: ./web
    container_name: letterboxd-to-radarr
    restart: unless-stopped
    ports:
      # Change the left side if 3080 conflicts with another service.
      # Radarr 7878, Lidarr 8686, Readarr 8787, Prowlarr 9696, Bazarr 6767.
      - "3080:3000"
    environment:
      # Letterboxd username, for example: jtmel
      REVIEWER: "CHANGE_ME"
      # Radarr base URL format: http://radarr.example.com:7878
      RADARR: "CHANGE_ME"
      # Radarr API key from Settings > General > Security.
      API_KEY: "CHANGE_ME"
    volumes:
      #- CHANGEME:/data